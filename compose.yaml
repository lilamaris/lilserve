services:
  reservation-service:
    image: lilamaris/reservation-service:latest
    environment:
      LILSERVE_DATASOURCE_URL: "${LILSERVE_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lilserve}}"
      LILSERVE_DATASOURCE_USERNAME: "${LILSERVE_DATASOURCE_USERNAME:-lilserve}"
      LILSERVE_DATASOURCE_PASSWORD: "${LILSERVE_DATASOURCE_PASSWORD:-lilserve}"
      LILSERVE_TIMEZONE: "${LILSERVE_TIMEZONE:-UTC}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BIND_HOST:-127.0.0.1}:${APP_BIND_PORT:-8080}:8080"
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-lilserve}"
      POSTGRES_USER: "${LILSERVE_DATASOURCE_USERNAME:-lilserve}"
      POSTGRES_PASSWORD: "${LILSERVE_DATASOURCE_PASSWORD:-lilserve}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "${BIND_HOST:-127.0.0.1}:${DB_BIND_PORT:-5432}:5432"
    volumes:
      - lilserve-postgres:/var/lib/postgresql

volumes:
  lilserve-postgres:
